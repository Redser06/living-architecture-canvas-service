<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omnichannel Payment & Real-Time Risk Mesh — Living Architecture Canvas</title>
  <style>:root {
  --bg-canvas: #F8F7F4;
  --grid-dot: #E6E4DD;
  --surface-card: #FFFFFF;
  --border-subtle: #E2E0D8;
  --border-strong: #C8C4B8;
  --ink-primary: #141413;
  --ink-secondary: #686763;
  --ink-muted: #9E9D99;
  --accent-flow: #1D4ED8;
  --accent-pulse: #EA580C;
  --accent-storage: #15803D;
  --accent-actor: #6D28D9;
  --accent-error: #B91C1C;
  --shadow-card: 0 2px 6px rgba(20, 20, 19, 0.04);
  --shadow-elevated: 0 12px 28px rgba(20, 20, 19, 0.08);
  --font-sans: "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background-color: var(--bg-canvas);
  background-image: radial-gradient(var(--grid-dot) 1.25px, transparent 1.25px);
  background-size: 20px 20px;
  color: var(--ink-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 58px;
  background: rgba(248, 247, 244, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 40;
}
.brand-block { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
.brand-title { font-size: 14.5px; font-weight: 650; letter-spacing: -0.02em; }
.brand-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-secondary); text-transform: uppercase; }
.toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }

.btn {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  color: var(--ink-primary);
  font-family: var(--font-sans);
  font-size: 11.5px; font-weight: 550;
  padding: 5px 10px; border-radius: 6px;
  cursor: pointer; transition: all 0.15s ease;
  box-shadow: var(--shadow-card);
  white-space: nowrap; flex-shrink: 0;
}
.btn:hover { border-color: var(--ink-secondary); }
.btn.active { background: var(--ink-primary); color: #FFF; border-color: var(--ink-primary); }
.btn-accent { background: var(--accent-flow); color: #FFF; border-color: var(--accent-flow); }

#viewport {
  position: fixed; inset: 58px 0 76px 0;
  overflow: hidden; cursor: grab;
  perspective: 1400px;
}
#viewport.whiteboard-active { cursor: crosshair; }

#world {
  position: absolute; top: 0; left: 0;
  transform-origin: 50% 50%;
  transition: transform 0.65s cubic-bezier(0.22, 0.61, 0.21, 1);
  transform-style: preserve-3d;
}
#world.layered-25d {
  transform: translate3d(var(--cam-x, 40px), var(--cam-y, 20px), 0) scale(var(--cam-scale, 0.85)) rotateX(24deg) rotateZ(-8deg);
}

#webgl-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: none; cursor: grab;
}

#direct-edit-hint {
  position: absolute; bottom: 12px; left: 20px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-secondary);
  background: rgba(255, 255, 255, 0.88); border: 1px solid var(--border-subtle);
  padding: 4px 10px; border-radius: 6px; pointer-events: none; z-index: 30;
}

.plane-band {
  position: absolute; left: 28px; right: 28px;
  border: 1px dashed var(--border-strong);
  background: rgba(255, 255, 255, 0.42);
  border-radius: 10px;
  pointer-events: none;
  transition: transform 0.6s ease, box-shadow 0.6s ease;
}
#world.layered-25d .plane-band {
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 18px 36px rgba(20, 20, 19, 0.06);
}
.plane-label {
  position: absolute; top: 10px; left: 14px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-secondary);
}

#edges-svg, #whiteboard-svg {
  position: absolute; top: 0; left: 0;
  overflow: visible; pointer-events: none;
}
#edges-svg path.edge-hit {
  pointer-events: stroke; stroke: transparent; stroke-width: 14px; fill: none; cursor: pointer;
}
#whiteboard-svg.active { pointer-events: all; }

.edge-path {
  fill: none; stroke: var(--border-strong); stroke-width: 1.75px;
  transition: opacity 0.35s ease, stroke 0.35s ease;
}
.edge-path.dimmed { opacity: 0.22; }
.edge-path.active-flow { stroke: var(--accent-flow); stroke-width: 2.2px; stroke-dasharray: 7 5; animation: dashFlow 0.9s linear infinite; }
.edge-path.active-pulse { stroke: var(--accent-pulse); stroke-width: 2.2px; }
.edge-path.active-fork, .edge-path.active-join { stroke: var(--accent-storage); stroke-width: 2.2px; }
.edge-path.active-error { stroke: var(--accent-error); stroke-width: 2.2px; stroke-dasharray: 5 4; }

@keyframes dashFlow { to { stroke-dashoffset: -24; } }

.node-card {
  position: absolute;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px 14px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: opacity 0.35s ease, transform 0.45s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  display: flex; flex-direction: column; justify-content: space-between;
}
.node-card:hover { border-color: var(--ink-secondary); box-shadow: var(--shadow-elevated); }
.node-card.dimmed { opacity: 0.28; }
.node-card.active { border-color: var(--accent-flow); box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12), var(--shadow-card); }
.node-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.node-kind-icon { font-size: 13px; }
.node-badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
  background: #F2F0E8; color: var(--ink-secondary);
}
.node-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-primary); margin-top: 4px; outline: none; }
.node-title[contenteditable="true"] { background: #FEF3C7; padding: 1px 4px; border-radius: 4px; }

.pin-badge {
  position: absolute; transform: translate(-50%, -100%);
  background: #FEF3C7; border: 1px solid #F59E0B; color: #92400E;
  font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
  box-shadow: var(--shadow-card); display: flex; align-items: center; gap: 4px;
  z-index: 25; white-space: nowrap;
}

#hud-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 76px;
  background: var(--surface-card);
  border-top: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; z-index: 40;
}
.narrative-box { max-width: 660px; }
.scene-kicker { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; color: var(--accent-flow); font-weight: 600; }
.scene-narrative { font-size: 13.5px; color: var(--ink-primary); margin-top: 2px; line-height: 1.38; }

#inspector {
  position: fixed; top: 58px; right: 0; bottom: 76px; width: 380px;
  background: var(--surface-card);
  border-left: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-elevated);
  padding: 20px; overflow-y: auto;
  transform: translateX(100%); transition: transform 0.25s ease; z-index: 45;
}
#inspector.open { transform: translateX(0); }
.inspector-input {
  width: 100%; margin-top: 6px; padding: 8px 10px;
  border: 1px solid var(--border-strong); border-radius: 6px;
  font-family: var(--font-sans); font-size: 12px;
}
.inspector-pre {
  margin-top: 10px; padding: 12px; border-radius: 6px;
  background: #F8F7F4; border: 1px solid var(--border-subtle);
  font-family: var(--font-mono); font-size: 11.5px; white-space: pre-wrap; overflow-x: auto;
}
</style>

// src/runtime/store.ts
function createStore(spec, layout) {
  const initialScene = spec.scenes?.[0];
  const state = {
    spec,
    layout,
    sceneIndex: 0,
    viewMode: initialScene?.camera?.viewMode || spec.meta?.defaultView || "2d-flow",
    selectedItem: null,
    whiteboardMode: false,
    pinMode: false,
    playing: true,
    panX: 30,
    panY: 20,
    zoom: 0.92,
    orbitYaw: -0.48,
    orbitPitch: 0.52,
    sketchOps: []
  };
  const listeners = new Set;
  return {
    getState: () => state,
    setState: (partial) => {
      Object.assign(state, partial);
      listeners.forEach((fn) => fn(state));
    },
    subscribe: (fn) => {
      listeners.add(fn);
      return () => listeners.delete(fn);
    }
  };
}

// src/runtime/dom-utils.ts
function el(tag, attrs = {}, children = []) {
  const element = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null)
      continue;
    if (k === "className")
      element.className = String(v);
    else if (k === "style" && typeof v === "object")
      Object.assign(element.style, v);
    else if (k.startsWith("on") && typeof v === "function") {
      element.addEventListener(k.slice(2).toLowerCase(), v);
    } else
      element.setAttribute(k, String(v));
  }
  for (const child of children) {
    element.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return element;
}
function svgEl(tag, attrs = {}) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null)
      element.setAttribute(k, String(v));
  }
  return element;
}
function clearChildren(node) {
  if (!node)
    return;
  while (node.firstChild)
    node.removeChild(node.firstChild);
}

// src/runtime/renderer-grid.ts
function renderPlanes(container, state) {
  clearChildren(container);
  const planes = state.layout?.planes || [];
  const is25d = state.viewMode === "2.5d-layered";
  for (const plane of planes) {
    const zOffset = is25d ? (plane.elevation || 0) * 0.45 : 0;

// src/runtime/whiteboard.ts
function attachWhiteboard(svgOverlay, getState, onNewOperation) {
  let drawing = false;
  let points = [];
  let activePath = null;
  const toWorldPoint = (e) => {
    const rect = svgOverlay.getBoundingClientRect();
    const s = getState();
    return {
      x: (e.clientX - rect.left) / (s.zoom || 1),
      y: (e.clientY - rect.top) / (s.zoom || 1)
    };
  };
  const hitTestNode = (pt, state) => {
    for (const [id, box] of Object.entries(state.layout.nodes || {})) {
      if (pt.x >= box.x && pt.x <= box.x + box.width && pt.y >= box.y && pt.y <= box.y + box.height) {
        return id;
      }
    }
    return null;
  };
  svgOverlay.addEventListener("pointerdown", (e) => {
    const state = getState();
    if (!state.whiteboardMode)
      return;
    drawing = true;
    points = [toWorldPoint(e)];
    activePath = svgEl("path", {
      fill: "none",
      stroke: "#EA580C",
      "stroke-width": "2.5",
      "stroke-linecap": "round",
      d: `M ${points[0].x} ${points[0].y}`
    });
    svgOverlay.appendChild(activePath);
  });
  window.addEventListener("pointermove", (e) => {
    if (!drawing || !activePath)
      return;
    const pt = toWorldPoint(e);
    points.push(pt);
    activePath.setAttribute("d", points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" "));
  });
  window.addEventListener("pointerup", () => {
    if (!drawing || points.length < 2) {
      drawing = false;
      return;
    }
    drawing = false;
    const state = getState();
    const startNode = hitTestNode(points[0], state);
    const endNode = hitTestNode(points[points.length - 1], state);
    if (startNode && endNode && startNode !== endNode) {
      onNewOperation({ action: "ADD_EDGE", from: startNode, to: endNode, protocol: "Event" });
    } else {
      const endPt = points[points.length - 1];
      const plane = state.layout.planes?.find((p) => endPt.y >= p.y && endPt.y <= p.y + p.height) || state.layout.planes?.[0];
      onNewOperation({
        action: "ADD_NODE",
        label: `Sketch Node ${state.sketchOps.length + 1}`,
        planeId: plane?.id || "plane-orchestration"
      });
    }
  });
}

  const edgesSvg = document.getElementById("edges-svg");
  const wbSvg = document.getElementById("whiteboard-svg");
  const webglCanvas = document.getElementById("webgl-canvas");
  const hudEl = document.getElementById("hud-bar");
  const inspectorEl = document.getElementById("inspector");
  const viewportEl = document.getElementById("viewport");
  const recordOp = (op) => {
    const s = store.getState();
    const nextOps = [...s.sketchOps, op];
    store.setState({ sketchOps: nextOps });
    window.parent?.postMessage({ type: "LIVING_ARCH_OP_QUEUED", op, operations: nextOps, spec: s.spec }, "*");
  };
  const syncUI = () => {
    const s = store.getState();
    const is3d = s.viewMode === "3d-webgl";
    worldEl.style.display = is3d ? "none" : "block";
    if (webglCanvas)
      webglCanvas.style.display = is3d ? "block" : "none";
    wbSvg.setAttribute("width", String(s.layout.width));
    wbSvg.setAttribute("height", String(s.layout.height));
    wbSvg.classList.toggle("active", s.whiteboardMode);
    viewportEl.classList.toggle("whiteboard-active", s.whiteboardMode || s.pinMode);
    applyCameraTransform(worldEl, s);
    renderPlanes(planesEl, s);
    renderEdges(edgesSvg, s, (edgeId) => store.setState({ selectedItem: { type: "edge", id: edgeId } }));
    renderNodes(nodesEl, s, (nodeId) => store.setState({ selectedItem: { type: "node", id: nodeId } }), recordOp);
    if (pinsEl)
      renderPins(pinsEl, s);
    renderNarrativeHud(hudEl, s, (idx) => store.setState({ sceneIndex: idx, viewMode: s.spec.scenes?.[idx]?.camera?.viewMode || s.viewMode }), () => store.setState({ playing: !s.playing }));
    renderInspector(inspectorEl, s, () => store.setState({ selectedItem: null }), recordOp);
    document.getElementById("btn-view-2d")?.classList.toggle("active", s.viewMode === "2d-flow");
    document.getElementById("btn-toggle-25d")?.classList.toggle("active", s.viewMode === "2.5d-layered");
    document.getElementById("btn-view-3d")?.classList.toggle("active", s.viewMode === "3d-webgl");
    document.getElementById("btn-toggle-wb")?.classList.toggle("active", s.whiteboardMode);
    document.getElementById("btn-pin-note")?.classList.toggle("active", s.pinMode);
    const btnDiff = document.getElementById("btn-export-diff");
    if (btnDiff)
      btnDiff.textContent = `Copy Diff (${s.sketchOps.length})`;
  };
  store.subscribe(syncUI);
  attachWhiteboard(wbSvg, store.getState, recordOp);
  attachDirectHtmlInteractions(viewportEl, nodesEl, store.getState, store.setState, recordOp);
  if (webglCanvas)
    start3DRenderer(webglCanvas, store.getState, store.setState);
  document.getElementById("btn-view-2d")?.addEventListener("click", () => store.setState({ viewMode: "2d-flow" }));
  document.getElementById("btn-toggle-25d")?.addEventListener("click", () => store.setState({ viewMode: store.getState().viewMode === "2.5d-layered" ? "2d-flow" : "2.5d-layered" }));
  document.getElementById("btn-view-3d")?.addEventListener("click", () => store.setState({ viewMode: "3d-webgl" }));
  document.getElementById("btn-toggle-wb")?.addEventListener("click", () => store.setState({ whiteboardMode: !store.getState().whiteboardMode, pinMode: false }));
  document.getElementById("btn-pin-note")?.addEventListener("click", () => store.setState({ pinMode: !store.getState().pinMode, whiteboardMode: false }));
  document.getElementById("btn-export-diff")?.addEventListener("click", () => {
    const payload = JSON.stringify({ timestamp: new Date().toISOString(), operations: store.getState().sketchOps }, null, 2);
    navigator.clipboard?.writeText(payload);
    inspectorEl.classList.add("open");
    inspectorEl.innerHTML = `<div class="scene-kicker">WHITEBOARD & HTML DIFF EXPORT</div><pre class="inspector-pre">${payload}</pre>`;
  });
  document.getElementById("btn-refactor-agent")?.addEventListener("click", () => {
    const s = store.getState();
    window.parent?.postMessage({ type: "LIVING_ARCH_REFACTOR_REQUEST", spec: s.spec, operations: s.sketchOps }, "*");
  });
  syncUI();
  startPacketAnimator(edgesSvg, store.getState);
}

if (typeof bootLivingArchitectureCanvas === 'function') bootLivingArchitectureCanvas();
})();</script>
</body>
</html>
